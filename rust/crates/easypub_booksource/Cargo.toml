[package]
name = "easypub_booksource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 书源插件的引擎（P1）：阅读 3.0 书源规则、JS、网络与正文。只给插件进程用，主程序不依赖。

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
encoding_rs.workspace = true
sha2.workspace = true
tokio.workspace = true
scraper = "0.24"
ego-tree = "=0.10.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "brotli", "native-tls", "http2", "socks", "system-proxy"] }
base64 = "=0.23.1"
time = { version = "=0.3.47", features = ["formatting", "parsing", "macros", "local-offset"] }
hex = "=0.4.3"
percent-encoding = "=2.3.2"
# 阅读书源里的环视、反向引用正则（Rust regex 不支持时兜底）。
fancy-regex = "=0.19.2"
# JS 引擎：QuickJS-NG。
rquickjs = "=0.14.0"
# 书源 JS 里的哈希与加解密（与 sha2 0.10 同一代 digest / cipher）。
md-5 = "=0.10.6"
sha1 = "=0.10.6"
aes = "=0.8.4"
des = "=0.8.1"
cbc = { version = "=0.1.2", features = ["alloc", "block-padding"] }
ecb = { version = "=0.1.2", features = ["alloc", "block-padding"] }
cipher = { version = "=0.4.4", features = ["alloc", "block-padding"] }
zhconv = "=0.4.2"
cookie_store = "=0.22.1"

[target."cfg(windows)".dependencies]
windows-registry = "=0.6.1"
# WebView 书源：调用系统自带的 WebView2。
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
